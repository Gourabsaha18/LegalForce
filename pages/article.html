<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LegalForce Article</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f5f7fa;
  color:#222;
}

/* HEADER */

.topbar{

  background:#111;

  padding:20px 60px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  position:sticky;
  top:0;
  z-index:999;
}

.logo{

  color:white;

  font-size:34px;
  font-weight:700;
}

.logo span{
  color:#ff2d2d;
}

.back-btn{

  text-decoration:none;

  background:#ff2d2d;
  color:white;

  padding:12px 18px;

  border-radius:8px;
}

/* ARTICLE */

.article-wrapper{

  width:90%;
  max-width:1200px;

  margin:auto;

  padding:60px 0;
}

.article-image{

  width:100%;
  height:550px;

  object-fit:cover;

  border-radius:20px;

  margin-bottom:40px;
}

.article-tag{

  display:inline-block;

  background:#ff2d2d;
  color:white;

  padding:8px 18px;

  border-radius:50px;

  margin-bottom:20px;

  font-size:14px;
  font-weight:600;
}

.article-title{

  font-size:54px;

  line-height:1.3;

  margin-bottom:25px;
}

.article-meta{

  display:flex;
  gap:20px;

  color:#666;

  margin-bottom:40px;
}

.article-content{

  background:white;

  padding:50px;

  border-radius:20px;

  box-shadow:
  0 10px 30px rgba(0,0,0,.08);
}

.article-content p{

  font-size:19px;

  line-height:2;

  margin-bottom:30px;

  color:#444;
}

.article-content h2{

  margin-top:40px;
  margin-bottom:20px;

  font-size:34px;
}

/* FOOTER */

.footer{

  background:#111;
  color:white;

  text-align:center;

  padding:40px;

  margin-top:80px;
}

/* MOBILE */

@media(max-width:768px){

  .topbar{
    padding:20px;
  }

  .article-title{
    font-size:36px;
  }

  .article-image{
    height:300px;
  }

  .article-content{
    padding:25px;
  }

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="topbar">

  <div class="logo">

    Legal<span>Force</span>

  </div>

  <a href="top-stories.html"
     class="back-btn">

     Back To News

  </a>

</header>

<!-- ARTICLE -->

<section class="article-wrapper">

  <img id="articleImage"
       class="article-image">

  <div class="article-tag"
       id="articleTag">
  </div>

  <h1 class="article-title"
      id="articleTitle">
  </h1>

  <div class="article-meta">

    <span id="articleDate"></span>

    <span>
      LegalForce Legal Desk
    </span>

  </div>

  <div class="article-content"
       id="articleContent">
  </div>

</section>

<!-- FOOTER -->

<footer class="footer">

  <p>

    © 2026 LegalForce Prototype

  </p>

</footer>

<!-- JAVASCRIPT -->

<script>

const articles = {

  1:{

    tag:'Supreme Court',

    title:'Supreme Court protects women career rights in marriage dispute',

    date:'Published Today',

    image:'https://images.unsplash.com/photo-1589829545856-d10d557cf95f?q=80&w=1400&auto=format&fit=crop',

    content:`

    <p>

    In a landmark judgment, the Supreme Court observed that a woman pursuing her professional career cannot be treated as matrimonial cruelty.

    </p>

    <p>

    The bench noted that career aspirations are protected under constitutional dignity and equality principles.

    </p>

    <h2>

    Major Observation

    </h2>

    <p>

    The court criticised outdated social assumptions that force women to sacrifice professional ambitions after marriage.

    </p>

    <p>

    Senior advocates believe this judgment will influence future matrimonial and constitutional Force matters across India.

    </p>

    `
  },

  2:{

    tag:'High Court',

    title:'Allahabad High Court imposes ₹1 lakh penalty in fake affidavit case',

    date:'4 Hours Ago',

    image:'https://images.unsplash.com/photo-1528740561666-dc2479dc08ab?q=80&w=1400&auto=format&fit=crop',

    content:`

    <p>

    Allahabad High Court imposed heavy costs on a litigant for concealing material facts before the judiciary.

    </p>

    <p>

    The court stated that abuse of judicial process damages public confidence and wastes valuable court time.

    </p>

    <h2>

    Court Warning

    </h2>

    <p>

    The bench warned that filing misleading affidavits may result in criminal consequences in future proceedings.

    </p>

    <p>

    Legal experts praised the decision for strengthening accountability in litigation practices.

    </p>

    `
  },

  3:{

    tag:'Delhi HC',

    title:'Delhi High Court rules bank accounts cannot be frozen arbitrarily',

    date:'Today',

    image:'https://images.unsplash.com/photo-1505664194779-8beaceb93744?q=80&w=1400&auto=format&fit=crop',

    content:`

    <p>

    Delhi High Court ruled that freezing bank accounts without proper judicial authority violates economic liberty.

    </p>

    <p>

    The court observed that financial access is closely connected to constitutional freedom and Legallihood.

    </p>

    <h2>

    Legal Significance

    </h2>

    <p>

    Investigating agencies must now follow strict procedural safeguards before restricting banking operations.

    </p>

    <p>

    The judgment is expected to influence cybercrime investigations and financial dispute matters nationwide.

    </p>

    `
  },

  4:{

    tag:'Education Force',

    title:'Supreme Court receives petition for NEET retest supervision',

    date:'Today',

    image:'https://images.unsplash.com/photo-1436450412740-6b988f486c6b?q=80&w=1400&auto=format&fit=crop',

    content:`

    <p>

    A fresh petition has been filed before the Supreme Court demanding transparent supervision of the NEET examination process.

    </p>

    <p>

    Students alleged irregularities and demanded reforms in examination administration.

    </p>

    <h2>

    Student Concerns

    </h2>

    <p>

    Petitioners argued that the credibility of competitive examinations is essential for equal educational opportunities.

    </p>

    `
  }

};

/* GET ARTICLE ID */

const params =
new URLSearchParams(window.location.search);

const id =
params.get('id') || 1;

/* SELECT ARTICLE */

const article =
articles[id];

/* LOAD DATA */

document.getElementById('articleTag')
.innerText = article.tag;

document.getElementById('articleTitle')
.innerText = article.title;

document.getElementById('articleDate')
.innerText = article.date;

document.getElementById('articleImage')
.src = article.image;

document.getElementById('articleContent')
.innerHTML = article.content;

</script>

</body>
</html>
